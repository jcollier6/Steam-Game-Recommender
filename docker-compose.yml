services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 10s
      retries: 5
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - backend-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      ML_RECOMMEND_URL: http://recommender:8001
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network
    develop:
      watch:
        - action: rebuild
          path: backend/main.py

  gatherer:
    build: ./gatherer
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      API_KEY: ${API_KEY}
    depends_on:
      - mysql
    networks:
      - backend-network
    entrypoint: ["tail", "-f", "/dev/null"] # Do nothing until manually run command
    profiles:
      - gatherer
    develop:
      watch:
        - action: rebuild
          path: gatherer/gather-data.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - recommender
    networks:
      - backend-network
    profiles:
      - prod    # <--- only spin this up for prod

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
      - recommender
    networks:
      - backend-network
    profiles:
      - dev     # <--- only spin this up for dev

  ml-extract:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - mysql
    networks:
      - backend-network
    volumes:
      - ./:/app
    gpus: all
    profiles: ["extract"]
    command: >
      bash -lc "\
        python3 ml/extract_features.py && \
        python3 ml/generate_embeddings.py && \
        python3 ml/build_dataset.py\
      "

  ml-train:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - mysql
    networks:
      - backend-network
    volumes:
      - ./:/app
    gpus: all
    profiles: ["train"]
    working_dir: /app
    command: python -m ml.pipeline.train_pipeline
      
  recommender:
    build:
      context: ./ml
      dockerfile: Dockerfile
    command: uvicorn recommend_games:app --host 0.0.0.0 --port 8001
    working_dir: /app/ml
    environment:
      - ML_DATA_DIR=/app/data
      - API_KEY=${API_KEY}
    volumes:
      - .:/app
    gpus: all
    ports:
      - "8001:8001"
    depends_on:
      - backend
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/docs"]
      interval: 5s
      timeout: 5s
      retries: 5
    develop:
      watch:
        - action: rebuild
          path: ml/recommend_games.py

volumes:
  frontend_node_modules:
  
networks:
  backend-network:
    driver: bridge
