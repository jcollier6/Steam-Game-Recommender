services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 10s
      retries: 5
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - backend-network

  backend:
    build: ./backend
    restart: always
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      API_KEY: ${API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network

  gatherer:
    build: ./gatherer
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      API_KEY: ${API_KEY}
    depends_on:
      - mysql
    networks:
      - backend-network
    entrypoint: ["tail", "-f", "/dev/null"] # Do nothing until manually run command

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backend-network
    profiles:
      - prod    # <--- only spin this up for prod

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - backend-network
    profiles:
      - dev     # <--- only spin this up for dev

  ml-extract:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - mysql
    networks:
      - backend-network
    volumes:
      - ./:/app
    gpus: all
    profiles: ["extract"]
    command: >
      bash -lc "\
        python3 ml/extract_features.py && \
        python3 ml/generate_embeddings.py && \
        python3 ml/build_dataset.py\
      "

  ml-train:
    build:
      context: ./ml
      dockerfile: Dockerfile
    env_file: .env
    depends_on:
      - mysql
    networks:
      - backend-network
    volumes:
      - ./:/app
    gpus: all
    profiles: ["train"]
    command: >
      bash -lc "\
        python3 ml/train_model.py\
      "
      
  recommender:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "ml/recommend_games.py"]
    environment:
      - ML_DATA_DIR=/app/ml/data
      - API_KEY=${API_KEY}
    volumes:
      - .:/app


networks:
  backend-network:
    driver: bridge
